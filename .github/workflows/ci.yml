name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check demucs_mlx tests

      - name: Type check
        run: uv run pyright

      - name: Run kernel tests
        run: uv run python tests/test_metal_kernels.py

      - name: Run apply_model chunk/seed regression
        run: uv run python tests/test_apply_model_chunk_seed.py

      - name: Run optional mlx-weights integration regression
        run: uv run python tests/test_model_converter_optional_mlx_weights.py

      - name: Run apply_model overlap-add regression
        run: uv run python tests/test_apply_model_overlap_add.py

      - name: Test CLI
        run: uv run demucs-mlx --list-models

      - name: Test import
        run: |
          uv run python -c "
          from demucs_mlx import Separator, save_audio, list_models
          models = list_models()
          print('Models:', models)
          assert 'htdemucs' in models['single']
          print('Import test passed')
          "

  build-app:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew deps
        run: |
          set -euo pipefail
          brew install libvorbis libogg

      - name: Wire externals (raylib + prebuilt rocksmith-psarc)
        run: |
          set -euo pipefail
          chmod +x app/scripts/setup_externals.sh app/scripts/vendor_raylib.sh
          bash app/scripts/setup_externals.sh

      - name: Build GUI (CMake Release)
        run: |
          set -euo pipefail
          make -C app build

      - name: Smoke --version
        run: |
          set -euo pipefail
          ./app/build/demucs_mlx_app --version
          ./app/build/demucs_mlx_app --version | grep -E 'demucs mlx app [0-9]'
