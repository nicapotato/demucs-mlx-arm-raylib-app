name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (leave empty to use project.conf)"
        required: false
        default: ""
        type: string
      publish_itch:
        description: "Push zip to itch.io"
        required: false
        default: true
        type: boolean
      publish_gh_release:
        description: "Create tag + GitHub Release assets"
        required: false
        default: true
        type: boolean
      build_platform:
        description: "macos / windows / all"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - macos
          - windows

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ITCH_USER: nicapotato
  ITCH_GAME: demucs-mlx-app-dev
  PYTHON_VERSION: "3.12"

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            V="${INPUT_VERSION}"
          else
            V=$(grep '^VERSION=' project.conf | cut -d= -f2 | tr -d '[:space:]')
          fi
          if [ -z "$V" ]; then
            echo "ERROR: empty version" >&2
            exit 1
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "Version: ${V} (tag v${V})"

  build-and-publish:
    runs-on: macos-latest
    needs: read-version
    timeout-minutes: 120
    if: contains(fromJSON('["macos","all"]'), github.event.inputs.build_platform)
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      VERSION: ${{ needs.read-version.outputs.version }}
      TAG: ${{ needs.read-version.outputs.tag }}
    steps:
      - name: Checkout demucs-mlx-arm-raylib-app
        uses: actions/checkout@v4

      - name: Install Homebrew deps
        run: |
          set -euo pipefail
          brew install libvorbis libogg ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Wire externals (raylib + checked-in prebuilt rocksmith-psarc)
        run: |
          set -euo pipefail
          chmod +x app/scripts/*.sh
          bash app/scripts/setup_externals.sh

      - name: Build GUI (CMake Release)
        run: make -C app build

      - name: Smoke --version
        run: |
          set -euo pipefail
          ./app/build/demucs_mlx_app --version
          ./app/build/demucs_mlx_app --version | grep -F "${VERSION}"

      - name: Install Python package (convert + freeze deps)
        run: |
          set -euo pipefail
          uv venv .venv --python "${{ env.PYTHON_VERSION }}"
          source .venv/bin/activate
          uv pip install -e '.[convert]' lameenc pyinstaller

      - name: Restore MLX model cache
        uses: actions/cache@v4
        id: model-cache
        with:
          path: app/models/htdemucs_6s_mlx.pkl
          key: htdemucs-6s-mlx-${{ hashFiles('demucs_mlx/__init__.py', 'demucs_mlx/remote/htdemucs_6s.yaml') }}

      - name: Convert / ensure MLX weights
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source .venv/bin/activate
          make -C app models
          test -f app/models/htdemucs_6s_mlx.pkl

      - name: Freeze worker (PyInstaller)
        run: |
          set -euo pipefail
          source .venv/bin/activate
          make -C app worker

      - name: Bundle .app + zip
        run: |
          set -euo pipefail
          bash app/scripts/build_app.sh
          test -f "app/dist/DemucsMLX-mac-arm64.zip"
          plutil -p "app/dist/DemucsMLX.app/Contents/Info.plist" | grep -F "${VERSION}"

      - name: Smoke bundled app headless (5s tone -> 6 stems)
        run: |
          set -euo pipefail
          mkdir -p /tmp/dmx_ci_in /tmp/dmx_ci_out
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=5" \
            -ac 2 -ar 44100 /tmp/dmx_ci_in/tone5s.mp3
          # No InitWindow — Actions macOS runners have no GPU/display for GLFW.
          "app/dist/DemucsMLX.app/Contents/MacOS/DemucsMLX" \
            --headless /tmp/dmx_ci_in/tone5s.mp3 --out /tmp/dmx_ci_out --mp3
          for s in drums bass other vocals guitar piano; do
            test -f "/tmp/dmx_ci_out/tone5s/${s}.mp3"
          done
          ls -la /tmp/dmx_ci_out/tone5s/

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "app/dist/DemucsMLX-mac-arm64.zip" release-assets/
          (
            cd release-assets
            shasum -a 256 DemucsMLX-mac-arm64.zip | tee DemucsMLX-mac-arm64.zip.sha256
          )
          ls -la release-assets/

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemucsMLX-mac-arm64-zip
          path: release-assets/*
          if-no-files-found: error

      - name: Setup butler
        if: github.event.inputs.publish_itch == 'true'
        uses: remarkablegames/setup-butler@v2
        with:
          butler-version: LATEST

      - name: Push to itch.io
        if: github.event.inputs.publish_itch == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "ERROR: BUTLER_API_KEY secret is not set" >&2
            exit 1
          fi
          butler push release-assets/DemucsMLX-mac-arm64.zip \
            "${ITCH_USER}/${ITCH_GAME}:macos-arm64" \
            --userversion "${VERSION}"
          echo "Pushed to itch.io ${ITCH_USER}/${ITCH_GAME}:macos-arm64 @ ${VERSION}"

  build-and-publish-windows:
    runs-on: windows-latest
    needs: read-version
    timeout-minutes: 180
    if: contains(fromJSON('["windows","all"]'), github.event.inputs.build_platform)
    outputs:
      gh_release_ok: ${{ steps.package.outputs.gh_release_ok }}
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      VERSION: ${{ needs.read-version.outputs.version }}
      TAG: ${{ needs.read-version.outputs.tag }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout demucs-mlx-arm-raylib-app
        uses: actions/checkout@v4

      - name: Clone and bootstrap vcpkg
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "%GITHUB_WORKSPACE%\vcpkg"
          call "%GITHUB_WORKSPACE%\vcpkg\bootstrap-vcpkg.bat"

      - name: Restore vcpkg downloads and installed trees
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/downloads
            ${{ github.workspace }}/vcpkg/installed
          key: vcpkg-${{ runner.os }}-x64-dmx-ports-v1

      - name: Install vcpkg ports
        shell: cmd
        run: |
          "%GITHUB_WORKSPACE%\vcpkg\vcpkg.exe" install zlib:x64-windows libogg:x64-windows libvorbis:x64-windows
          if errorlevel 1 exit /b 1

      - name: Restore vgmstream checkout
        uses: actions/cache@v4
        with:
          path: app/external/rocksmith-psarc-src/external/vgmstream
          key: vgmstream-${{ hashFiles('app/scripts/vendor_vgmstream.sh') }}

      - name: Wire externals (raylib + vgmstream)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x app/scripts/*.sh
          bash app/scripts/setup_externals.sh

      - name: Configure and build GUI (CMake Release, MSVC + vcpkg)
        shell: cmd
        working-directory: app
        run: |
          set "TOOLCHAIN=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake"
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=%TOOLCHAIN% -DVCPKG_TARGET_TRIPLET=x64-windows -A x64
          if errorlevel 1 exit /b 1
          cmake --build build --config Release --parallel -- /verbosity:minimal /nologo
          if errorlevel 1 exit /b 1

      - name: Smoke --version
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${VCPKG_ROOT}/installed/x64-windows/bin:${PATH}"
          EXE="app/build/Release/DemucsMLX.exe"
          test -f "$EXE"
          "$EXE" --version
          "$EXE" --version | grep -F "${VERSION}"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CUDA torch + Demucs + freeze deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cu121
          python -m pip install -r requirements-windows.txt
          $env:PYTHONPATH = (Get-Location).Path

      - name: Restore Demucs torch checkpoint cache
        uses: actions/cache@v4
        id: torch-model-cache
        with:
          path: app/models/torch
          key: htdemucs-6s-torch-${{ hashFiles('requirements-windows.txt', 'demucs_torch/separate.py') }}

      - name: Prefetch official Demucs weights
        if: steps.torch-model-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:DEMUCS_TORCH_PYTHON = (Get-Command python).Source
          pwsh -File app/scripts/prefetch_torch_models.ps1

      - name: Freeze torch worker (PyInstaller)
        shell: pwsh
        run: |
          $env:DEMUCS_TORCH_PYTHON = (Get-Command python).Source
          pwsh -File app/scripts/freeze_worker_torch.ps1

      - name: Package Windows zip
        id: package
        shell: pwsh
        run: |
          pwsh -File app/scripts/build_windows.ps1
          if (-not (Test-Path "app/dist/DemucsMLX-windows-x86_64.zip")) { exit 1 }

      - name: Install ffmpeg
        shell: cmd
        run: choco install ffmpeg --no-progress -y

      - name: Smoke bundled app headless (5s tone -> 6 stems, CPU)
        timeout-minutes: 30
        shell: pwsh
        env:
          DEMUCS_DEVICE: cpu
        run: |
          $in = Join-Path $env:TEMP "dmx_ci_in"
          $out = Join-Path $env:TEMP "dmx_ci_out"
          New-Item -ItemType Directory -Force -Path $in, $out | Out-Null
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=5" -ac 2 -ar 44100 "$in\tone5s.mp3"
          $env:DEMUCS_DEVICE = "cpu"
          & "app\dist\DemucsMLX\DemucsMLX.exe" --headless "$in\tone5s.mp3" --out $out --mp3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($s in @("drums","bass","other","vocals","guitar","piano")) {
            $p = Join-Path $out "tone5s\$s.mp3"
            if (-not (Test-Path $p)) { Write-Error "missing $p"; exit 1 }
          }
          Get-ChildItem "$out\tone5s"

      - name: Prepare zip artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/dist/DemucsMLX-windows-x86_64.zip release-assets/
          (
            cd release-assets
            sha256sum DemucsMLX-windows-x86_64.zip | tee DemucsMLX-windows-x86_64.zip.sha256
          )

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemucsMLX-windows-x86_64-zip
          path: release-assets/*
          if-no-files-found: error

      - name: Setup butler
        if: github.event.inputs.publish_itch == 'true'
        uses: remarkablegames/setup-butler@v2
        with:
          butler-version: LATEST

      - name: Push to itch.io (Windows)
        if: github.event.inputs.publish_itch == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "ERROR: BUTLER_API_KEY secret is not set" >&2
            exit 1
          fi
          butler push release-assets/DemucsMLX-windows-x86_64.zip \
            "${ITCH_USER}/${ITCH_GAME}:windows-x86-64" \
            --userversion "${VERSION}"
          echo "Pushed to itch.io ${ITCH_USER}/${ITCH_GAME}:windows-x86-64 @ ${VERSION}"

  publish-gh-release:
    runs-on: ubuntu-latest
    needs: [read-version, build-and-publish, build-and-publish-windows]
    if: >-
      github.event.inputs.publish_gh_release == 'true' &&
      !cancelled() &&
      (needs.build-and-publish.result == 'success' ||
       needs.build-and-publish.result == 'skipped') &&
      (needs.build-and-publish-windows.result == 'success' ||
       needs.build-and-publish-windows.result == 'skipped') &&
      (needs.build-and-publish.result == 'success' ||
       needs.build-and-publish-windows.result == 'success')
    env:
      TAG: ${{ needs.read-version.outputs.tag }}
      VERSION: ${{ needs.read-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard duplicate tag
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Tag ${TAG} already exists; bump VERSION in project.conf" >&2
            exit 1
          fi
          echo "Tag ${TAG} is available"

      - name: Download macOS zip
        if: needs.build-and-publish.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: DemucsMLX-mac-arm64-zip
          path: release-assets

      - name: Download Windows zip
        if: needs.build-and-publish-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: DemucsMLX-windows-x86_64-zip
          path: release-assets

      - name: Drop Windows zip if over GitHub 2GB asset cap
        if: needs.build-and-publish-windows.result == 'success'
        run: |
          set -euo pipefail
          WIN="release-assets/DemucsMLX-windows-x86_64.zip"
          if [ -f "$WIN" ]; then
            BYTES=$(stat -c%s "$WIN")
            if [ "$BYTES" -ge 2147483648 ]; then
              echo "Windows zip is ${BYTES} bytes (>= 2 GiB). Skipping GitHub Release asset; itch.io is the storefront."
              rm -f "$WIN" "${WIN}.sha256"
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: DemucsMLX ${{ env.TAG }}
          generate_release_notes: true
          body: |
            ## Downloads
            - **macOS Apple Silicon:** `DemucsMLX-mac-arm64.zip` (MLX + Metal)
            - **Windows x64:** `DemucsMLX-windows-x86_64.zip` (official Demucs + CUDA; omitted here if over 2 GB — use itch.io)

            Also on itch.io: https://nicapotato.itch.io/demucs-mlx-app
            Channels: `macos-arm64`, `windows-x86-64`
          files: |
            release-assets/*